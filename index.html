<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avocado AR Exhibit</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
  <style>
    #banner {
      position: fixed; top: 0; left: 0; right: 0; z-index: 999;
      padding: 14px; text-align: center; font: bold 18px sans-serif;
      color: #fff; background: #c0392b; transition: background .3s;
    }
    #banner.found { background: #27ae60; }
  </style>
  <script>
    // Component 1 (workshop): tap the ball to cycle its colour
    AFRAME.registerComponent('color-change', {
      init: function () {
        const colors = ['#e74c3c', '#f1c40f', '#3498db', '#9b59b6', '#2ecc71'];
        let i = 0;
        this.el.addEventListener('click', () => {
          i = (i + 1) % colors.length;
          this.el.setAttribute('color', colors[i]);
        });
      }
    });

    // Component 2 (new): tap the cone to grow/shrink the avocado and toggle the plaque
    AFRAME.registerComponent('grow-toggle', {
      schema: { target: { type: 'selector' }, plaque: { type: 'selector' } },
      init: function () {
        let big = false;
        this.el.addEventListener('click', () => {
          big = !big;
          const s = big ? 9 : 5;
          this.data.target.setAttribute('scale', `${s} ${s} ${s}`);
          this.data.plaque.setAttribute('visible', big);
          this.el.setAttribute('color', big ? '#e67e22' : '#16a085');
        });
      }
    });

    // Status banner: changes text + colour on marker found/lost
    AFRAME.registerComponent('status-banner', {
      init: function () {
        const b = document.getElementById('banner');
        this.el.addEventListener('markerFound', () => {
          b.textContent = '✅ Marker found – enjoy the exhibit!';
          b.classList.add('found');
        });
        this.el.addEventListener('markerLost', () => {
          b.textContent = '🔍 Marker lost – point at the Hiro marker';
          b.classList.remove('found');
        });
      }
    });
  </script>
</head>
<body style="margin:0; overflow:hidden;">
  <div id="banner">🔍 Marker lost – point at the Hiro marker</div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;"
           renderer="logarithmicDepthBuffer: true;" vr-mode-ui="enabled: false">

    <a-marker preset="hiro" status-banner>

      <!-- Label -->
      <a-text value="The Avocado Exhibit" align="center" color="#2ecc71"
              position="0 1.6 0" rotation="-90 0 0" width="4"></a-text>

      <!-- Pedestal (cylinder) -->
      <a-cylinder position="0 0.1 0" radius="0.5" height="0.2" color="#7f8c8d"></a-cylinder>

      <!-- 3D model: Avocado (CC0, Microsoft) – animated spin -->
      <a-entity id="avocado" gltf-model="url(models/avocado.glb)"
                position="0 0.5 0" scale="5 5 5"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
      </a-entity>

      <!-- Plaque (box), hidden until the cone is tapped -->
      <a-box id="plaque" visible="false" position="0 0.15 0.8" width="1.2" height="0.3" depth="0.05"
             color="#ecf0f1">
        <a-text value="Persea americana" align="center" color="#000" position="0 0 0.03" width="2.2"></a-text>
      </a-box>

      <!-- Tappable ball: colour change + bouncing animation -->
      <a-sphere class="clickable" color-change color="#e74c3c" radius="0.2"
                position="-0.9 0.4 0"
                animation="property: position; to: -0.9 0.9 0; dir: alternate; loop: true; dur: 1000; easing: easeInOutSine">
      </a-sphere>

      <!-- Tappable cone: grows avocado + toggles plaque -->
      <a-cone class="clickable" grow-toggle="target: #avocado; plaque: #plaque"
              color="#16a085" radius-bottom="0.25" height="0.5" position="0.9 0.25 0">
      </a-cone>

      <!-- Spinning ring (torus) -->
      <a-torus color="#f1c40f" radius="0.8" radius-tubular="0.02" position="0 0.6 0"
               rotation="90 0 0"
               animation="property: rotation; to: 90 0 360; loop: true; dur: 5000; easing: linear">
      </a-torus>

    </a-marker>

    <a-entity camera cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>
  </a-scene>
</body>
</html>
